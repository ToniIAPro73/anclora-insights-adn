name: CI

on:
  push:
    branches: ["main", "development", "staging", "production"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit, doubles as type check)
        run: npm run -s lint

      - name: Build
        run: npm run -s build
